# Opt-in public live-terminal pilot. Keep this overlay separate from the
# default compose deployment: it is enabled only after Turnstile credentials
# and the benchmark gate are in place. Both builds are pinned to the reviewed
# application commit rather than a mutable branch or environment variable.
#
# Always name the public services explicitly with `up`; otherwise Compose also
# acts on every unprofiled production service in docker-compose.yml. See the
# enablement and rollback commands in docs/public-live-terminal-pilot.md.
# This revision defines exactly six isolated worker seats. Each worker has a
# private gateway network, a private attachment to the shared MCP service, and
# a private direct-egress network so workers cannot address one another.

x-fin-terminal-public-worker: &fin-terminal-public-worker
  build:
    context: "https://github.com/protostatis/unbrowser-fin-terminal.git#e937377b945ed84d721ebd06e22510b5f805e19d"
    args:
      PUBLIC_BASE_PATH: /
      VITE_TERMINAL_BUILD_MODE: live
  expose:
    - "8787"
  environment:
    - NODE_ENV=production
    - HOST=0.0.0.0
    - PORT=8787
    - MARKET_ROOT=/app
    - MARKET_DATA_DIR=/tmp/market-terminal
    - PI_CODING_AGENT_DIR=/tmp/pi-agent
    - UNBROWSER_MCP_URL=http://fin-terminal-public-unbrowser-mcp:8767/mcp
    - UNBROWSER_MCP_REQUIRED=1
    - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?OPENROUTER_API_KEY_required}
    - OPENROUTER_MODEL=${FIN_TERMINAL_OPENROUTER_MODEL:-deepseek/deepseek-v4-flash-0731}
    - MARKET_MAX_OUTPUT_TOKENS=${FIN_TERMINAL_MAX_OUTPUT_TOKENS:-4096}
    - MARKET_RESEARCH_CONCURRENCY=1
    - MARKET_PROXY_TOKEN=${FIN_TERMINAL_PUBLIC_WORKER_PROXY_TOKEN:?FIN_TERMINAL_PUBLIC_WORKER_PROXY_TOKEN_required}
    - ALLOWED_ORIGINS=https://unbrowser.unchainedsky.com
    - PUBLIC_DEMO=0
    - PUBLIC_SESSION_WORKER=1
    - PUBLIC_IDLE_TIMEOUT_SECONDS=300
    - PUBLIC_SESSION_MAX_SECONDS=900
    - PUBLIC_RECONNECT_GRACE_SECONDS=30
    - PUBLIC_MAX_RESEARCH_RUNS=5
    # Research-permit gate: workers acquire the gateway-owned global permit over
    # the private seat network (fin-terminal-public-gateway:8789). The
    # management listener is never published and never proxied by Caddy.
    - TERMINAL_RUNTIME_FEATURE_ENABLED=${TERMINAL_RUNTIME_FEATURE_ENABLED:-false}
    - TERMINAL_RUNTIME_MANAGEMENT_TOKEN=${TERMINAL_RUNTIME_MANAGEMENT_TOKEN:-}
    - TERMINAL_RUNTIME_MANAGEMENT_URL=http://fin-terminal-public-gateway:8789
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=268435456,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true
  pids_limit: 128
  cpus: 1.0
  mem_limit: 1g
  mem_reservation: 256m
  stop_grace_period: 60s
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 15s
    timeout: 3s
    retries: 3
    start_period: 30s

services:
  fin-terminal-public-redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1"]
    expose:
      - "6379"
    volumes:
      - fin_terminal_public_redis:/data
    networks:
      - fin_terminal_public_state
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16777216,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 0.25
    mem_limit: 256m
    mem_reservation: 64m
    restart: unless-stopped
    profiles: ["fin-terminal-public-pilot"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  fin-terminal-public-unbrowser-mcp:
    build:
      context: .
      dockerfile: Dockerfile.unbrowser-mcp
    expose:
      - "8767"
    depends_on:
      unbrowser-egress:
        condition: service_healthy
    networks:
      - fin_terminal_public_mcp_01
      - fin_terminal_public_mcp_02
      - fin_terminal_public_mcp_03
      - fin_terminal_public_mcp_04
      - fin_terminal_public_mcp_05
      - fin_terminal_public_mcp_06
      - unbrowser_egress_proxy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=67108864,mode=1777
      - /home/unchained:rw,nosuid,nodev,noexec,size=67108864,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 96
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 128m
    restart: unless-stopped
    profiles: ["fin-terminal-public-pilot"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client; c=http.client.HTTPConnection('localhost',8767,timeout=2); c.request('GET','/status'); r=c.getresponse(); c.close(); assert r.status == 200, r.status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  fin-terminal-public-gateway:
    build:
      context: "https://github.com/protostatis/unbrowser-fin-terminal.git#e937377b945ed84d721ebd06e22510b5f805e19d"
      args:
        PUBLIC_BASE_PATH: /fin-terminal-live-pilot/
        VITE_TERMINAL_BUILD_MODE: public-live
    expose:
      - "8788"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8788
      - MARKET_ROOT=/app
      - TERMINAL_RUNTIME_MODE=public-gateway
      - PUBLIC_BASE_PATH=/fin-terminal-live-pilot/
      - PUBLIC_ALLOWED_ORIGIN=https://unbrowser.unchainedsky.com
      - PUBLIC_REDIS_URL=redis://fin-terminal-public-redis:6379/0
      - PUBLIC_SESSION_SIGNING_KEY=${FIN_TERMINAL_PUBLIC_SESSION_SIGNING_KEY:?FIN_TERMINAL_PUBLIC_SESSION_SIGNING_KEY_required}
      - PUBLIC_EDGE_PROXY_TOKEN=${FIN_TERMINAL_PUBLIC_EDGE_PROXY_TOKEN:?FIN_TERMINAL_PUBLIC_EDGE_PROXY_TOKEN_required}
      - PUBLIC_WORKER_PROXY_TOKEN=${FIN_TERMINAL_PUBLIC_WORKER_PROXY_TOKEN:?FIN_TERMINAL_PUBLIC_WORKER_PROXY_TOKEN_required}
      - PUBLIC_TURNSTILE_SITE_KEY=${FIN_TERMINAL_PUBLIC_TURNSTILE_SITE_KEY:?FIN_TERMINAL_PUBLIC_TURNSTILE_SITE_KEY_required}
      - PUBLIC_TURNSTILE_SECRET=${FIN_TERMINAL_PUBLIC_TURNSTILE_SECRET:?FIN_TERMINAL_PUBLIC_TURNSTILE_SECRET_required}
      - PUBLIC_TURNSTILE_EXPECTED_HOSTNAME=unbrowser.unchainedsky.com
      - PUBLIC_MAX_SESSIONS=6
      - PUBLIC_MAX_QUEUE=50
      - PUBLIC_TICKET_TTL_SECONDS=600
      - PUBLIC_RECONNECT_GRACE_SECONDS=30
      - PUBLIC_IDLE_TIMEOUT_SECONDS=300
      - PUBLIC_SESSION_MAX_SECONDS=900
      - PUBLIC_MAX_RESEARCH_RUNS=5
      - PUBLIC_DAILY_RESEARCH_BUDGET_MICRO_USD=10000000
      - PUBLIC_RESEARCH_RUN_RESERVATION_MICRO_USD=200000
      - PUBLIC_ADMISSION_ATTEMPTS=5
      - PUBLIC_ADMISSION_WINDOW_SECONDS=600
      - PUBLIC_WORKER_ENDPOINTS=seat-01=http://fin-terminal-public-seat-01:8787,seat-02=http://fin-terminal-public-seat-02:8787,seat-03=http://fin-terminal-public-seat-03:8787,seat-04=http://fin-terminal-public-seat-04:8787,seat-05=http://fin-terminal-public-seat-05:8787,seat-06=http://fin-terminal-public-seat-06:8787
      # Private management API for the host-side reconciler. Never exposed on the
      # public edge. The token is passed via an exact header; the listener is on a
      # separate internal port (8789) that Caddy never proxies. The reconciler
      # reaches it via `docker exec` on loopback; workers reach it over the
      # private seat networks.
      - TERMINAL_RUNTIME_MANAGEMENT_TOKEN=${TERMINAL_RUNTIME_MANAGEMENT_TOKEN:-}
      - TERMINAL_RUNTIME_FEATURE_ENABLED=${TERMINAL_RUNTIME_FEATURE_ENABLED:-false}
      - TERMINAL_RUNTIME_MANAGEMENT_PORT=${TERMINAL_RUNTIME_MANAGEMENT_PORT:-8789}
      # Workspace checkpoint S2S: the gateway exports the assigned worker's
      # authoritative checkpoint and forwards it to the control plane over the
      # private network. All three names must match the control-plane service
      # exactly (FIN_WORKSPACE_CONTROL_TOKEN / FIN_TERMINAL_BASE_URL below).
      - FINANCIAL_WORKSPACE_CHECKPOINTS=${FIN_TERMINAL_WORKSPACE_ENABLED:-false}
      - FINANCIAL_WORKSPACE_CONTROL_TOKEN=${FIN_WORKSPACE_CONTROL_TOKEN:-}
      - FINANCIAL_WORKSPACE_SERVICE_URL=http://fin-terminal-workspace-control:8790
    depends_on:
      fin-terminal-public-redis:
        condition: service_healthy
    networks:
      - fin_terminal_public
      - fin_terminal_public_state
      - fin_terminal_public_egress
      - fin_terminal_public_seat_01
      - fin_terminal_public_seat_02
      - fin_terminal_public_seat_03
      - fin_terminal_public_seat_04
      - fin_terminal_public_seat_05
      - fin_terminal_public_seat_06
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=134217728,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 96
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 128m
    stop_grace_period: 30s
    restart: unless-stopped
    profiles: ["fin-terminal-public-pilot"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s

  fin-terminal-public-seat-01:
    <<: *fin-terminal-public-worker
    networks:
      - fin_terminal_public_seat_01
      - fin_terminal_public_egress_01
      - fin_terminal_public_mcp_01
    profiles: ["fin-terminal-public-pilot"]

  fin-terminal-public-seat-02:
    <<: *fin-terminal-public-worker
    networks:
      - fin_terminal_public_seat_02
      - fin_terminal_public_egress_02
      - fin_terminal_public_mcp_02
    profiles: ["fin-terminal-public-pilot"]

  fin-terminal-public-seat-03:
    <<: *fin-terminal-public-worker
    networks:
      - fin_terminal_public_seat_03
      - fin_terminal_public_egress_03
      - fin_terminal_public_mcp_03
    profiles: ["fin-terminal-public-pilot"]

  fin-terminal-public-seat-04:
    <<: *fin-terminal-public-worker
    networks:
      - fin_terminal_public_seat_04
      - fin_terminal_public_egress_04
      - fin_terminal_public_mcp_04
    profiles: ["fin-terminal-public-pilot"]

  fin-terminal-public-seat-05:
    <<: *fin-terminal-public-worker
    networks:
      - fin_terminal_public_seat_05
      - fin_terminal_public_egress_05
      - fin_terminal_public_mcp_05
    profiles: ["fin-terminal-public-pilot"]

  fin-terminal-public-seat-06:
    <<: *fin-terminal-public-worker
    networks:
      - fin_terminal_public_seat_06
      - fin_terminal_public_egress_06
      - fin_terminal_public_mcp_06
    profiles: ["fin-terminal-public-pilot"]

  # Financial workspace control — opt-in feature flag.
  # Real Python control plane (the same unchained web app as `web`, on its own
  # port 8790). It owns auth/S3/KMS/checkpoint logic and serves:
  #   - S2S internal API (Docker-internal only; Caddy denies /internal/*)
  #   - browser handoff/auth/callback routes under /fin-terminal-workspace/*
  # Fail-closed: when FIN_TERMINAL_WORKSPACE_ENABLED=true without the explicit
  # control token / S3 bucket / region / KMS key / storage config, the app
  # refuses to start (no JWT_SECRET fallback, no local storage).
  fin-terminal-workspace-control:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "web", "--host", "0.0.0.0", "--port", "8790"]
    expose:
      - "8790"
    volumes:
      - relay_data:/data
    networks:
      - fin_terminal_public          # accessible from Caddy
      - fin_terminal_public_state    # Redis (fin-terminal-public-redis:6379)
      - fin_terminal_workspace_egress  # AWS S3/KMS egress only
    # The host-side runtime provider (fin-workspace-runtime-provider.service)
    # owns the Docker socket. The control plane reaches it over the host
    # gateway at the configured URL; nothing is published to the host edge.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=33554432,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 96
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 128m
    restart: unless-stopped
    profiles: ["fin-terminal-workspace"]
    # Feature-gate: only starts when the workspace profile is explicitly enabled.
    environment:
      - UNCHAINED_DB_PATH=/data/auth.db
      - FIN_TERMINAL_WORKSPACE_ENABLED=${FIN_TERMINAL_WORKSPACE_ENABLED:-false}
      - FIN_WORKSPACE_ENABLED=${FIN_TERMINAL_WORKSPACE_ENABLED:-false}
      - FIN_WORKSPACE_CONTROL_TOKEN=${FIN_WORKSPACE_CONTROL_TOKEN:-}
      - FIN_WORKSPACE_COOKIE_DOMAIN=${FIN_WORKSPACE_COOKIE_DOMAIN:-}
      - FIN_WORKSPACE_S3_BUCKET=${FIN_WORKSPACE_S3_BUCKET:-}
      - FIN_WORKSPACE_S3_REGION=${FIN_WORKSPACE_S3_REGION:-}
      - FIN_WORKSPACE_KMS_KEY_ID=${FIN_WORKSPACE_KMS_KEY_ID:-}
      - WORKSPACE_REDIS_URL=redis://fin-terminal-public-redis:6379/1
      - JWT_SECRET=${JWT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - FACEBOOK_OAUTH_DIALOG_URL=${FACEBOOK_OAUTH_DIALOG_URL:-}
      - FACEBOOK_GRAPH_API_BASE=${FACEBOOK_GRAPH_API_BASE:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_OAUTH_AUTHORIZE_URL=${GITHUB_OAUTH_AUTHORIZE_URL:-}
      - GITHUB_OAUTH_TOKEN_URL=${GITHUB_OAUTH_TOKEN_URL:-}
      - GITHUB_API_BASE=${GITHUB_API_BASE:-}
      - FIN_TERMINAL_BASE_URL=${FIN_TERMINAL_BASE_URL:-https://unbrowser.unchainedsky.com/fin-terminal-workspace}
      # Host-side runtime provider (hard enablement gate). Enabling the
      # feature without a validated provider is a fail-closed startup error;
      # /fin-terminal/ never falls back to the marketing index or singleton.
      - FIN_WORKSPACE_RUNTIME_PROVIDER_URL=${FIN_WORKSPACE_RUNTIME_PROVIDER_URL:-http://host.docker.internal:8793}
      - FIN_WORKSPACE_RUNTIME_PROVIDER_TOKEN=${FIN_WORKSPACE_RUNTIME_PROVIDER_TOKEN:-}
      # Shared proxy token the control plane injects toward each account
      # runtime (X-Fin-Terminal-Proxy-Token) and the provider hands to the
      # runtime container as MARKET_PROXY_TOKEN. Must match the provider's
      # FIN_WORKSPACE_RUNTIME_PROXY_TOKEN.
      - FIN_WORKSPACE_RUNTIME_PROXY_TOKEN=${FIN_WORKSPACE_RUNTIME_PROXY_TOKEN:-}
      - TRIAL_AGENT_KEY=${TRIAL_AGENT_KEY:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client; c=http.client.HTTPConnection('localhost',8790,timeout=2); c.request('GET','/internal/health'); r=c.getresponse(); c.close(); assert r.status == 200, r.status"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  # Shared unbrowser MCP service for account workspace runtimes. The host-side
  # runtime provider attaches this container to every per-account private
  # network at wake so each isolated runtime can run research against the MCP
  # while siblings can never reach each other's network or data. Sibling
  # runtimes are never placed on a shared network.
  fin-terminal-workspace-unbrowser-mcp:
    build:
      context: .
      dockerfile: Dockerfile.unbrowser-mcp
    expose:
      - "8767"
    depends_on:
      unbrowser-egress:
        condition: service_healthy
    networks:
      - fin_terminal_public
      - unbrowser_egress_proxy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=67108864,mode=1777
      - /home/unchained:rw,nosuid,nodev,noexec,size=67108864,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 96
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 128m
    restart: unless-stopped
    profiles: ["fin-terminal-workspace"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client; c=http.client.HTTPConnection('localhost',8767,timeout=2); c.request('GET','/status'); r=c.getresponse(); c.close(); assert r.status == 200, r.status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  fin_terminal_public_redis:

networks:
  fin_terminal_public_state:
    internal: true
  fin_terminal_public_mcp_01:
    internal: true
    ipam:
      config:
        - subnet: 10.253.0.0/29
  fin_terminal_public_mcp_02:
