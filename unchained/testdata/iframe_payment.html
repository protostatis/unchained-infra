<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 16px; background: #fff; }
    h2 { font-size: 0.95rem; margin: 0 0 12px; color: #333; }
    label { display: block; font-size: 0.8rem; color: #555; margin-bottom: 2px; }
    input {
      width: 100%; padding: 8px 10px; border: 1px solid #ccc;
      border-radius: 4px; font-size: 0.9rem; margin-bottom: 10px;
    }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    button {
      width: 100%; padding: 10px; background: #635bff; color: white;
      border: none; border-radius: 4px; font-size: 0.9rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Card details</h2>
  <form id="payment-form">
    <label for="card-number">Card number</label>
    <input id="card-number" type="text" placeholder="1234 5678 9012 3456"
           autocomplete="cc-number" maxlength="19">

    <div class="row">
      <div>
        <label for="expiry">Expiry</label>
        <input id="expiry" type="text" placeholder="MM / YY"
               autocomplete="cc-exp" maxlength="7">
      </div>
      <div>
        <label for="cvc">CVC</label>
        <input id="cvc" type="text" placeholder="123"
               autocomplete="cc-csc" maxlength="4">
      </div>
    </div>

    <button type="submit">Pay now</button>
  </form>
</body>
</html>
