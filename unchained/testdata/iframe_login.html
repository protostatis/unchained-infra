<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign in</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 16px; background: #fff; }
    h2 { font-size: 0.95rem; margin: 0 0 12px; color: #333; }
    label { display: block; font-size: 0.8rem; color: #555; margin-bottom: 2px; }
    input {
      width: 100%; padding: 8px 10px; border: 1px solid #ccc;
      border-radius: 4px; font-size: 0.9rem; margin-bottom: 10px;
    }
    .divider { text-align: center; color: #aaa; font-size: 0.8rem; margin: 8px 0; }
    button {
      width: 100%; padding: 10px; border: none; border-radius: 4px;
      font-size: 0.9rem; cursor: pointer; margin-bottom: 6px;
    }
    .btn-primary { background: #1a73e8; color: white; }
    .btn-google  { background: white; color: #444; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h2>Sign in</h2>
  <form id="login-form">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com"
           autocomplete="email">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••"
           autocomplete="current-password">

    <button type="submit" class="btn-primary">Continue</button>
  </form>

  <div class="divider">or</div>
  <button class="btn-google" id="google-signin">Sign in with Google</button>
</body>
</html>
