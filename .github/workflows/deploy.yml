name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: check-secrets
        env:
          HAS_SECRETS: ${{ secrets.EC2_SSH_KEY != '' && secrets.EC2_HOST != '' && secrets.PRIVATE_CORE_REPO_PAT != '' }}
        run: echo "available=$HAS_SECRETS" >> "$GITHUB_OUTPUT"

      - name: Skip notice
        if: steps.check-secrets.outputs.available != 'true'
        run: |
          echo "Skipped — deploy secrets not configured"
          exit 0

      - uses: actions/checkout@v4
        if: steps.check-secrets.outputs.available == 'true'

      - name: Checkout private core
        if: steps.check-secrets.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: protostatis/unchained-core-private
          token: ${{ secrets.PRIVATE_CORE_REPO_PAT }}
          path: private-core

      - name: Set up SSH key
        if: steps.check-secrets.outputs.available == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/unchained-key.pem
          chmod 600 ~/.ssh/unchained-key.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run deploy.sh
        if: steps.check-secrets.outputs.available == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # Delegate to deploy.sh — same path the team uses manually.
          # Reusing it instead of re-implementing in YAML eliminates drift
          # and gets us the staged restart, stub guards, web_app/installers/
          # research_desk_vendor sync, and image pruning for free.
          #
          # Env overrides:
          #   PRIVATE_CORE_SRC — points deploy.sh at the path we just checked
          #     out at "private-core/" instead of its default sibling-repo path.
          #   RHYTHM_SRC=/nonexistent — forces deploy.sh's empty-rhythm fallback
          #     since the rhythm repo isn't accessible to this workflow's PAT.
          #     Rhythm tools will report "not available" until we either grant
          #     the workflow access or run a manual deploy.
          #   DEPLOY_RESTORE_WORKTREE=0 — runner is ephemeral, no need to
          #     restore overlaid private-core files at the end.
          export KEY_PATH="$HOME/.ssh/unchained-key.pem"
          export EC2_USER="ec2-user"
          export PRIVATE_CORE_SRC="$(pwd)/private-core/unchained"
          export RHYTHM_SRC="/nonexistent"
          export DEPLOY_RESTORE_WORKTREE=0
          ./deploy.sh
