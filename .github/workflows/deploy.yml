name: Deploy to EC2

# Auto-deploy on push is disabled: the workflow uses `docker compose up -d --build`
# which stops every container and races with manual `./deploy.sh` runs, leaving
# services in a stopped state when the workflow fails mid-flight (see incident
# 2026-04-27). Trigger manually via the Actions tab when needed.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: check-secrets
        env:
          HAS_SECRETS: ${{ secrets.EC2_SSH_KEY != '' && secrets.EC2_HOST != '' && secrets.PRIVATE_CORE_REPO_PAT != '' }}
        run: echo "available=$HAS_SECRETS" >> "$GITHUB_OUTPUT"

      - name: Skip notice
        if: steps.check-secrets.outputs.available != 'true'
        run: |
          echo "Skipped — deploy secrets not configured"
          exit 0

      - uses: actions/checkout@v4
        if: steps.check-secrets.outputs.available == 'true'

      - name: Checkout private core
        if: steps.check-secrets.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: protostatis/unchained-core-private
          token: ${{ secrets.PRIVATE_CORE_REPO_PAT }}
          path: private-core

      - name: Overlay private core files
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          ./tools/install_private_core.sh private-core/unchained unchained

      - name: Deploy to EC2
        if: steps.check-secrets.outputs.available == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/unchained-key.pem
          chmod 600 ~/.ssh/unchained-key.pem
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null

          EC2_USER="ec2-user"
          REMOTE_DIR="/home/$EC2_USER/unchained"
          SSH_CMD="ssh -i ~/.ssh/unchained-key.pem $EC2_USER@$EC2_HOST"
          SCP_CMD="scp -i ~/.ssh/unchained-key.pem"

          # Single source of truth for the runtime file list. deploy.sh
          # sources this same file. Adding a new server-side runtime file
          # only requires editing runtime_context_files.sh.
          source deploy/runtime_context_files.sh

          $SCP_CMD "${TOP_LEVEL_CONTEXT_FILES[@]}" $EC2_USER@$EC2_HOST:$REMOTE_DIR/

          $SSH_CMD "mkdir -p $REMOTE_DIR/unchained/benchmark"

          UNCHAINED_UPLOAD=()
          for rel in "${UNCHAINED_RUNTIME_FILES[@]}"; do
            UNCHAINED_UPLOAD+=("unchained/$rel")
          done
          $SCP_CMD "${UNCHAINED_UPLOAD[@]}" $EC2_USER@$EC2_HOST:$REMOTE_DIR/unchained/

          BENCHMARK_UPLOAD=()
          for rel in "${BENCHMARK_CONTEXT_FILES[@]}"; do
            BENCHMARK_UPLOAD+=("unchained/benchmark/$rel")
          done
          $SCP_CMD "${BENCHMARK_UPLOAD[@]}" $EC2_USER@$EC2_HOST:$REMOTE_DIR/unchained/benchmark/

          # Ship native installer artifacts (.exe, .pkg, .dmg, build scripts).
          # Without this step, prebuilt installer binaries never reach prod and
          # /web/download-installer keeps serving whatever was last uploaded.
          $SSH_CMD "mkdir -p $REMOTE_DIR/unchained/installers"
          shopt -s nullglob
          INSTALLER_FILES=(unchained/installers/*)
          shopt -u nullglob
          if [ "${#INSTALLER_FILES[@]}" -gt 0 ]; then
            $SCP_CMD "${INSTALLER_FILES[@]}" $EC2_USER@$EC2_HOST:$REMOTE_DIR/unchained/installers/
          fi

          $SSH_CMD "cd $REMOTE_DIR && docker compose up -d --build"
          $SSH_CMD "docker compose -f $REMOTE_DIR/docker-compose.yml ps"
