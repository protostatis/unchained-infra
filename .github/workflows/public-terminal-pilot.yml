name: Public Terminal Pilot

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Pilot control action"
        required: true
        type: choice
        options:
          - status
          - activate-runtime
          - disable
      confirm:
        description: >-
          For activate-runtime: type 'ACTIVATE RUNTIME PILOT'.
          For disable: type 'DISABLE PUBLIC PILOT'.
          For status: leave empty.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  pilot:
    # Restrict to main branch only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://unbrowser.unchainedsky.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require action-specific confirmation for mutating actions
        if: inputs.action != 'status'
        env:
          CONFIRM: ${{ inputs.confirm }}
          ACTION: ${{ inputs.action }}
        run: |
          case "$ACTION" in
            activate-runtime) expected="ACTIVATE RUNTIME PILOT" ;;
            disable)          expected="DISABLE PUBLIC PILOT" ;;
            *)                expected="" ;;
          esac
          if [[ "$CONFIRM" != "$expected" ]]; then
            echo "::error::The '$ACTION' action requires confirmation."
            echo "::error::For activate-runtime: type 'ACTIVATE RUNTIME PILOT' in the confirm input."
            echo "::error::For disable:  type 'DISABLE PUBLIC PILOT' in the confirm input."
            exit 1
          fi

      - name: Guard against stale main revision
        id: candidate
        run: |
          git fetch --no-tags origin main --depth=1
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::A newer main commit exists; this pilot action is not on latest main."
            exit 1
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Hash host runtime artifacts
        id: runtime
        run: |
          reconciler_sha="$(sha256sum deploy/terminal_runtime_reconciler.py | cut -d' ' -f1)"
          unit_sha="$(sha256sum deploy/terminal-runtime-reconciler.service | cut -d' ' -f1)"
          [[ "$reconciler_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$unit_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "reconciler_sha=$reconciler_sha" >> "$GITHUB_OUTPUT"
          echo "unit_sha=$unit_sha" >> "$GITHUB_OUTPUT"

      - name: Require production pilot secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=()
          for name in EC2_HOST EC2_SSH_KEY SSH_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::error::Missing required production secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Prepare verified SSH configuration
        id: ssh
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          ssh_dir="$RUNNER_TEMP/unchained-pilot-ssh"
          umask 077
          mkdir -p "$ssh_dir"
          printf '%s\n' "$EC2_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null
          echo "key=$ssh_dir/key" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$ssh_dir/known_hosts" >> "$GITHUB_OUTPUT"

      - name: Execute pilot control script
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER || 'ec2-user' }}
          KEY_PATH: ${{ steps.ssh.outputs.key }}
          SSH_KNOWN_HOSTS_PATH: ${{ steps.ssh.outputs.known_hosts }}
          ACTION: ${{ inputs.action }}
          MAIN_SHA: ${{ steps.candidate.outputs.revision }}
          RECONCILER_SHA: ${{ steps.runtime.outputs.reconciler_sha }}
          RECONCILER_UNIT_SHA: ${{ steps.runtime.outputs.unit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "::error::EC2_USER has an invalid format."
            exit 1
          fi
          if [[ ! "$EC2_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::EC2_HOST has an invalid format."
            exit 1
          fi
          git fetch --no-tags origin main --depth=1
          if [[ "$(git rev-parse origin/main)" != "$MAIN_SHA" ]]; then
            echo "::error::Main advanced before the pilot action started."
            exit 1
          fi
          ssh_opts=(
            -i "$KEY_PATH"
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
            -o StrictHostKeyChecking=yes
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=4
          )
          # Read and validate the exact host revision immediately before the
          # locked action. Disable/status may target an older deployed main
          # after a newer main deploy was correctly blocked by an active pilot.
          metadata_path="/home/${EC2_USER}/unchained/.deploy-current"
          printf -v q_metadata_path '%q' "$metadata_path"
          deployed_sha="$(ssh "${ssh_opts[@]}" "$EC2_USER@$EC2_HOST" \
            "awk -F= '/^revision=/ { print \$2; exit }' $q_metadata_path")"
          if [[ ! "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The host did not report a valid deployed revision."
            exit 1
          fi
          if [[ "$ACTION" == "activate-runtime" ]]; then
            expected_sha="$MAIN_SHA"
          else
            expected_sha="$deployed_sha"
          fi

          # Quote and validate ACTION and the exact expected host revision for
          # the remote command. The script rechecks it after acquiring .deploy.lock.
          printf -v q_sha '%q' "$expected_sha"
          printf -v q_reconciler_sha '%q' "$RECONCILER_SHA"
          printf -v q_unit_sha '%q' "$RECONCILER_UNIT_SHA"

          run_remote_action() {
            local remote_action="$1" q_action
            printf -v q_action '%q' "$remote_action"
            # Stream the reviewed script over verified SSH stdin. Never pass
            # provider credentials or the runtime management token; the token
            # is generated on-host inside the locked activation transaction.
            ssh "${ssh_opts[@]}" "$EC2_USER@$EC2_HOST" \
              "bash -s -- $q_action $q_sha $q_reconciler_sha $q_unit_sha" \
              < "$GITHUB_WORKSPACE/deploy/public_terminal_pilot_remote.sh"
          }

          fail_closed_disable() {
            local disabled=false
            for attempt in 1 2 3; do
              if run_remote_action disable; then
                disabled=true
                break
              fi
              sleep 10
            done
            [[ "$disabled" == "true" ]]
          }

          if [[ "$ACTION" != "activate-runtime" ]]; then
            run_remote_action "$ACTION"
            exit 0
          fi

          # Even an SSH/session failure must attempt containment. Disable is
          # idempotent when the remote activation trap already restored 404.
          if ! run_remote_action activate-runtime; then
            echo "::error::Runtime activation transaction failed; enforcing fail-closed disable."
            if ! fail_closed_disable; then
              echo "::error::Fail-closed disable also failed; immediate operator intervention is required."
            fi
            exit 1
          fi

          # A systemd ActiveState check while the activation lock is held is
          # insufficient: prove that a real post-unlock reconcile cycle ran.
          # Any failed verification immediately returns the public edge to 404.
          runtime_verified=false
          for attempt in 1 2 3 4 5 6 7 8; do
            sleep 10
            if run_remote_action verify-runtime; then
              runtime_verified=true
              break
            fi
          done
          if [[ "$runtime_verified" != "true" ]]; then
            echo "::error::Runtime verification failed; disabling the public pilot fail-closed."
            if ! fail_closed_disable; then
              echo "::error::Fail-closed disable also failed; immediate operator intervention is required."
            fi
            exit 1
          fi

      - name: Remove deployment SSH files
        if: always()
        run: rm -rf "$RUNNER_TEMP/unchained-pilot-ssh"
