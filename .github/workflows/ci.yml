name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy this main commit after CI passes"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  public-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./unchained

      - name: Validate dev and deploy launcher syntax
        run: |
          bash -n dev.sh
          bash -n deploy.sh
          bash -n deploy/public_terminal_pilot_remote.sh
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.public-terminal.yml \
            config --no-interpolate --quiet
          python deploy/test_compose_service_diff.py
          python deploy/test_fin_terminal_secrets.py
          python deploy/test_public_terminal_pilot.py
          python deploy/test_terminal_runtime_reconciler.py
          python deploy/test_workspace_runtime_provider.py

      - name: Run public-safe tests
        run: |
          cd unchained
          python test_open_core_boundary.py
          python test_cloud_tools_click.py
          python test_opencode_agent.py
          python test_chat_event_transport.py
          python test_sse_write_guard.py
          python test_search_console_verification.py
          python test_bridge_helpers.py
          python -m unittest \
            test_credit \
            test_credit_handlers \
            test_hosted_billing \
            test_hosted_admission \
            test_scheduler_agent_access \
            test_scheduled_tasks \
            test_hosted_conversations \
            test_dev_script \
            test_fin_terminal \
            test_fin_workspace \
            test_fin_workspace_integration \
            test_web_routes \
            test_trial_new_chat \
            test_web_contracts

      - name: Run JS chat recovery test
        run: |
          cd unchained
          node test_sse_recovery_render.js

      - name: Run OSS boundary guards
        run: |
          python tools/oss_guard/check_private_imports.py
          python tools/oss_guard/check_agent_artifact_leaks.py
          python tools/oss_guard/check_public_doc_leaks.py

  private-integrated-tests:
    # Never expose the private-core credential to pull-request code. Protected
    # main runs retain the integrated coverage before a production deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require private core access
        env:
          PRIVATE_CORE_REPO_PAT: ${{ secrets.PRIVATE_CORE_REPO_PAT }}
        run: |
          if [[ -z "$PRIVATE_CORE_REPO_PAT" ]]; then
            echo "::error::PRIVATE_CORE_REPO_PAT is required for protected-main integration tests."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout private core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: protostatis/unchained-core-private
          token: ${{ secrets.PRIVATE_CORE_REPO_PAT }}
          path: private-core
          persist-credentials: false

      - name: Overlay private core files
        run: ./tools/install_private_core.sh private-core/unchained unchained

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./unchained

      - name: Run integrated tests
        run: |
          cd unchained
          python test_dom_density.py
          python test_page_intel.py
          python test_reflex.py
          python test_tab_leak.py
          python test_web_contracts.py

  deploy-production:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: [public-tests, private-integrated-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://unchainedsky.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Skip an obsolete queued deployment
        id: candidate
        run: |
          git fetch --no-tags origin main --depth=1
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::notice::A newer main commit exists; this queued deployment is obsolete."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Require production deployment inputs
        if: steps.candidate.outputs.deploy == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          PRIVATE_CORE_REPO_PAT: ${{ secrets.PRIVATE_CORE_REPO_PAT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          FIN_TERMINAL_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.FIN_TERMINAL_PUBLIC_TURNSTILE_SITE_KEY }}
          FIN_TERMINAL_PUBLIC_TURNSTILE_SECRET: ${{ secrets.FIN_TERMINAL_PUBLIC_TURNSTILE_SECRET }}
        run: |
          missing=()
          for name in EC2_HOST EC2_SSH_KEY PRIVATE_CORE_REPO_PAT SSH_KNOWN_HOSTS \
            FIN_TERMINAL_PUBLIC_TURNSTILE_SITE_KEY FIN_TERMINAL_PUBLIC_TURNSTILE_SECRET; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::error::Missing required production secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Checkout private core
        if: steps.candidate.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: protostatis/unchained-core-private
          token: ${{ secrets.PRIVATE_CORE_REPO_PAT }}
          path: private-core
          persist-credentials: false

      - name: Prepare verified SSH configuration
        if: steps.candidate.outputs.deploy == 'true'
        id: ssh
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          ssh_dir="$RUNNER_TEMP/unchained-deploy-ssh"
          mkdir -p "$ssh_dir"
          umask 077
          printf '%s\n' "$EC2_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null
          echo "key=$ssh_dir/key" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$ssh_dir/known_hosts" >> "$GITHUB_OUTPUT"

      - name: Deploy verified main revision
        if: steps.candidate.outputs.deploy == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DEPLOY_REVISION: ${{ github.sha }}
          KEY_PATH: ${{ steps.ssh.outputs.key }}
          DEPLOY_SSH_KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts }}
          PRIVATE_CORE_SRC: ${{ github.workspace }}/private-core/unchained
          FIN_TERMINAL_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.FIN_TERMINAL_PUBLIC_TURNSTILE_SITE_KEY }}
          FIN_TERMINAL_PUBLIC_TURNSTILE_SECRET: ${{ secrets.FIN_TERMINAL_PUBLIC_TURNSTILE_SECRET }}
        run: ./deploy.sh

      - name: Remove deployment SSH files
        if: always()
        run: rm -rf "$RUNNER_TEMP/unchained-deploy-ssh"
