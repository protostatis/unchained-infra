services:
  headless-bridge:
    build:
      context: .
      dockerfile: Dockerfile.headless
    command: [
      "python", "chrome_bridge.py", "start",
      "--relay", "${UNCHAINED_RELAY_URL:?UNCHAINED_RELAY_URL_required}",
      "--key", "${UNCHAINED_API_KEY:?UNCHAINED_API_KEY_required}",
      "--profile", "${CDP_PROFILE:-ec2-headless}",
      "--headless",
      "--stealth"
    ]
    volumes:
      - headless_data:/data
    environment:
      - UNCHAINED_DATA_DIR=/data
      - UNCHAINED_RELAY_URL=${UNCHAINED_RELAY_URL:?UNCHAINED_RELAY_URL_required}
      - UNCHAINED_API_KEY=${UNCHAINED_API_KEY:?UNCHAINED_API_KEY_required}
      - CDP_PORT=${CDP_PORT:-9222}
      - CDP_PROFILE=${CDP_PROFILE:-ec2-headless}
      - UNCHAINED_CHROME_HEADLESS=1
      - UNCHAINED_CHROME_ARGS=${UNCHAINED_CHROME_ARGS:-}
      # /json/version can stay responsive while page CDP commands are hung.
      # The bridge performs bounded recovery after two failed Page.enable probes.
      - UNCHAINED_CDP_LIVENESS_WATCHDOG=1
      - NOPECHA_EXT_DIR=${NOPECHA_EXT_DIR:-/opt/nopecha}
      - TZ=America/New_York
    healthcheck:
      test: ["CMD", "python", "chrome_bridge.py", "probe"]
      interval: 30s
      # The probe allows independent HTTP, WebSocket-connect, and CDP-response
      # phases, so its Docker timeout must cover the full bounded sequence.
      timeout: 30s
      retries: 3
      start_period: 45s
    restart: unless-stopped

volumes:
  headless_data:
