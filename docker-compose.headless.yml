services:
  headless-bridge:
    build:
      context: .
      dockerfile: Dockerfile.headless
    command: [
      "python", "chrome_bridge.py", "start",
      "--relay", "${UNCHAINED_RELAY_URL:?UNCHAINED_RELAY_URL_required}",
      "--key", "${UNCHAINED_API_KEY:?UNCHAINED_API_KEY_required}",
      "--profile", "${CDP_PROFILE:-ec2-headless}",
      "--headless",
      "--stealth"
    ]
    volumes:
      - headless_data:/data
    environment:
      - UNCHAINED_DATA_DIR=/data
      - UNCHAINED_RELAY_URL=${UNCHAINED_RELAY_URL:?UNCHAINED_RELAY_URL_required}
      - UNCHAINED_API_KEY=${UNCHAINED_API_KEY:?UNCHAINED_API_KEY_required}
      - CDP_PORT=${CDP_PORT:-9222}
      - CDP_PROFILE=${CDP_PROFILE:-ec2-headless}
      - UNCHAINED_CHROME_HEADLESS=1
      - UNCHAINED_CHROME_ARGS=${UNCHAINED_CHROME_ARGS:-}
      - TZ=America/New_York
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9222/json/version', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 35s
    restart: unless-stopped

volumes:
  headless_data:
