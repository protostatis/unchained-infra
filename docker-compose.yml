services:
  caddy:
    image: caddy:2.11.4@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    labels:
      com.unchainedsky.caddy.version: "2.11.4"
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      relay:
        condition: service_healthy
      mcp:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      - FIN_TERMINAL_PROXY_TOKEN=${FIN_TERMINAL_PROXY_TOKEN:?FIN_TERMINAL_PROXY_TOKEN_required}
      - FIN_TERMINAL_DEMO_PROXY_TOKEN=${FIN_TERMINAL_DEMO_PROXY_TOKEN:?FIN_TERMINAL_DEMO_PROXY_TOKEN_required}
      - FIN_TERMINAL_PUBLIC_EDGE_PROXY_TOKEN=${FIN_TERMINAL_PUBLIC_EDGE_PROXY_TOKEN:?FIN_TERMINAL_PUBLIC_EDGE_PROXY_TOKEN_required}
      - FIN_TERMINAL_PUBLIC_ENABLED=${FIN_TERMINAL_PUBLIC_ENABLED:-false}
    networks:
      - edge
      - app
      - unbrowser_mcp
      - fin_terminal
      - fin_terminal_demo
      - fin_terminal_public
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  relay:
    build: .
    expose:
      - "8765"
    volumes:
      - relay_data:/data
    environment:
      - UNCHAINED_DB_PATH=/data/auth.db
      - PRIVATE_CORE_URL=http://private-core:8770
      - PRIVATE_CORE_TOKEN=${PRIVATE_CORE_TOKEN:?PRIVATE_CORE_TOKEN_required}
    networks:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client; c=http.client.HTTPConnection('localhost',8765,timeout=2); c.request('GET','/health'); r=c.getresponse(); c.close(); assert r.status == 200, r.status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  private-core:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "private_core_server.py", "--host", "0.0.0.0", "--port", "8770"]
    expose:
      - "8770"
    environment:
      - PRIVATE_CORE_TOKEN=${PRIVATE_CORE_TOKEN:?PRIVATE_CORE_TOKEN_required}
      - RELAY_INTERNAL_HOST=relay
      - RELAY_INTERNAL_PORT=8765
      - RHYTHM_ROOT=/app/rhythm
    networks:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client; c=http.client.HTTPConnection('localhost',8770,timeout=2); c.request('GET','/health'); r=c.getresponse(); c.close(); assert r.status == 200, r.status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "mcp_server.py", "--host", "0.0.0.0"]
    expose:
      - "8766"
    volumes:
      - relay_data:/data
    environment:
      - UNCHAINED_DB_PATH=/data/auth.db
      - UNCHAINED_ANALYTICS_DB_PATH=/data/analytics.db
      - RELAY_INTERNAL_URL=ws://relay:8765
      - PRIVATE_CORE_URL=http://private-core:8770
      - PRIVATE_CORE_TOKEN=${PRIVATE_CORE_TOKEN:?PRIVATE_CORE_TOKEN_required}
    depends_on:
      relay:
        condition: service_healthy
      private-core:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client; c=http.client.HTTPConnection('localhost',8766,timeout=2); c.request('GET','/mcp'); r=c.getresponse(); c.close(); assert r.status<500,r.status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  unbrowser-mcp:
    build:
      context: .
      dockerfile: Dockerfile.unbrowser-mcp
    expose:
      - "8767"
    depends_on:
      unbrowser-egress:
        condition: service_healthy
    networks:
      - unbrowser_mcp
      - unbrowser_egress_proxy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client; c=http.client.HTTPConnection('localhost',8767,timeout=2); c.request('GET','/status'); r=c.getresponse(); c.close(); assert r.status == 200, r.status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  fin-terminal:
    build:
      context: "https://github.com/protostatis/unbrowser-fin-terminal.git#ef1c6b12832b79364d4f0abd67bfa5114822fa94"
      args:
        PUBLIC_BASE_PATH: /fin-terminal/
    expose:
      - "8787"
    volumes:
      - fin_terminal_data:/data
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8787
      - PUBLIC_BASE_PATH=/fin-terminal/
      - MARKET_ROOT=/app
      - MARKET_DATA_DIR=/data/market-terminal
      - PI_CODING_AGENT_DIR=/data/pi-agent
      - UNBROWSER_MCP_URL=http://unbrowser-mcp:8767/mcp
      - UNBROWSER_MCP_REQUIRED=1
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?OPENROUTER_API_KEY_required}
      - OPENROUTER_MODEL=${FIN_TERMINAL_OPENROUTER_MODEL:-deepseek/deepseek-v4-flash-0731}
      - MARKET_MAX_OUTPUT_TOKENS=${FIN_TERMINAL_MAX_OUTPUT_TOKENS:-4096}
      - MARKET_PROXY_TOKEN=${FIN_TERMINAL_PROXY_TOKEN:?FIN_TERMINAL_PROXY_TOKEN_required}
      - ALLOWED_ORIGINS=https://unbrowser.unchainedsky.com
      - PUBLIC_DEMO=0
    depends_on:
      unbrowser-mcp:
        condition: service_healthy
    networks:
      - fin_terminal
      - fin_terminal_egress
      - unbrowser_mcp
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=134217728,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 128
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 256m
    stop_grace_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

  fin-terminal-demo:
    # Public static replay of the financial terminal. It has no agent, model,
    # source retrieval, persistence, or outbound dependency.
    build:
      context: "https://github.com/protostatis/unbrowser-fin-terminal.git#4c587fe7d7713304b26b226433cb2282b25faea6"
      args:
        PUBLIC_BASE_PATH: /fin-terminal-demo/
    expose:
      - "8788"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8788
      - PUBLIC_BASE_PATH=/fin-terminal-demo/
      - MARKET_ROOT=/app
      - MARKET_PROXY_TOKEN=${FIN_TERMINAL_DEMO_PROXY_TOKEN:?FIN_TERMINAL_DEMO_PROXY_TOKEN_required}
      - PUBLIC_DEMO=1
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=134217728,mode=1777
      - /data:rw,nosuid,nodev,size=134217728,mode=0755,uid=1000,gid=1000
    networks:
      - fin_terminal_demo
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 64
    cpus: 0.5
    mem_limit: 768m
    mem_reservation: 128m
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

  unbrowser-egress:
    build:
      context: .
      dockerfile: Dockerfile.unbrowser-mcp
    command: ["python", "unbrowser_ssrf_proxy.py", "--host", "0.0.0.0", "--port", "8888"]
    expose:
      - "8888"
    environment:
      - UNBROWSER_PROXY_ALLOWED_PORTS=80,443
    networks:
      - unbrowser_egress_proxy
      - egress
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('localhost',8888),2); s.close()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "web", "--host", "0.0.0.0"]
    expose:
      - "8080"
    volumes:
      - relay_data:/data
    environment:
      - UNCHAINED_DB_PATH=/data/auth.db
      - RELAY_INTERNAL_URL=ws://relay:8765
      - PRIVATE_CORE_URL=http://private-core:8770
      - PRIVATE_CORE_TOKEN=${PRIVATE_CORE_TOKEN:?PRIVATE_CORE_TOKEN_required}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@unchainedsky.com}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - FIN_TERMINAL_ALLOWED_EMAILS=${FIN_TERMINAL_ALLOWED_EMAILS:-}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-hello@unchainedsky.com}
      - TRIAL_AGENT_KEY=${TRIAL_AGENT_KEY:?TRIAL_AGENT_KEY_required}
      - TRIAL_AGENT_ID=${TRIAL_AGENT_ID:-}
      - HEADLESS_API_KEY=${HEADLESS_API_KEY:-}
      - PROVIDER_KEY_SALT=${PROVIDER_KEY_SALT:-}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - FACEBOOK_OAUTH_DIALOG_URL=${FACEBOOK_OAUTH_DIALOG_URL:-}
      - FACEBOOK_GRAPH_API_BASE=${FACEBOOK_GRAPH_API_BASE:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_OAUTH_AUTHORIZE_URL=${GITHUB_OAUTH_AUTHORIZE_URL:-}
      - GITHUB_OAUTH_TOKEN_URL=${GITHUB_OAUTH_TOKEN_URL:-}
      - GITHUB_API_BASE=${GITHUB_API_BASE:-}
      - UNCHAINED_SSE_DEBUG=${UNCHAINED_SSE_DEBUG:-0}
      - HOSTED_AGENT_SERVICE_TOKEN=${HOSTED_AGENT_SERVICE_TOKEN:?HOSTED_AGENT_SERVICE_TOKEN_required}
      - HOSTED_MAX_ACTIVE_TURNS=${HOSTED_MAX_ACTIVE_TURNS:-16}
      - HOSTED_MAX_ACTIVE_TURNS_PER_USER=${HOSTED_MAX_ACTIVE_TURNS_PER_USER:-3}
      - HOSTED_TURN_DEADLINE_SECONDS=${HOSTED_TURN_DEADLINE_SECONDS:-600}
      - CREDIT_STALE_RUN_TTL_SECONDS=${CREDIT_STALE_RUN_TTL_SECONDS:-7200}
      - CREDIT_DEFAULT_RESERVATION_MICRO_USD=${CREDIT_DEFAULT_RESERVATION_MICRO_USD:-1000000}
      - CREDIT_ADMIN_ALLOWLIST=${CREDIT_ADMIN_ALLOWLIST:-}
      - UNCHAINED_SESSIONS_DIR=${UNCHAINED_SESSIONS_DIR:-/data/sessions}
    depends_on:
      - relay
      - private-core
    networks:
      - app
      - egress
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client; c=http.client.HTTPConnection('localhost',8080,timeout=2); c.request('GET','/internal/health'); r=c.getresponse(); c.close(); assert r.status == 200, r.status"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scheduled_tasks.py", "daemon-multi",
              "--jobs-dir", "/data/scheduler_jobs",
              "--db-path", "/data/auth.db",
              "--poll-seconds", "30"]
    volumes:
      - relay_data:/data
    environment:
      - UNCHAINED_API_URL=http://web:8080
      - UNCHAINED_DB_PATH=/data/auth.db
    depends_on:
      - web
    networks:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  trial-agent:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "chat_agent_openrouter.py",
              "--agent", "${TRIAL_AGENT_ID:-a-trial0000}"]
    volumes:
      - relay_data:/data
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-3.1-flash-lite}
      - UNCHAINED_API_KEY=${TRIAL_AGENT_KEY:?TRIAL_AGENT_KEY_required}
      - UNCHAINED_SERVER=ws://web:8080
      - RELAY_HOST=relay
      - RELAY_PORT=8765
      - SESSION_DIR=${UNCHAINED_SESSIONS_DIR:-/data/sessions}
      - UNCHAINED_SESSIONS_DIR=${UNCHAINED_SESSIONS_DIR:-/data/sessions}
      - PRIVATE_CORE_URL=http://private-core:8770
      - PRIVATE_CORE_TOKEN=${PRIVATE_CORE_TOKEN:?PRIVATE_CORE_TOKEN_required}
      - HOSTED_AGENT_SERVICE_TOKEN=${HOSTED_AGENT_SERVICE_TOKEN:?HOSTED_AGENT_SERVICE_TOKEN_required}
      - HOSTED_MAX_INPUT_CHARS=${HOSTED_MAX_INPUT_CHARS:-200000}
    depends_on:
      - relay
      - web
      - private-core
    networks:
      - app
      - egress
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  fin_terminal_data:
  relay_data:

networks:
  edge:
  egress:
  unbrowser_mcp:
    internal: true
  unbrowser_egress_proxy:
    internal: true
  fin_terminal:
    internal: true
  # Deliberately non-internal: only the terminal joins this network, for OpenRouter.
  fin_terminal_egress:
  fin_terminal_demo:
    internal: true
  # Gateway ↔ disposable public terminal workers only. It is deliberately
  # separate from both the signed-in terminal and the static replay network.
  fin_terminal_public:
    internal: true
  app:
    internal: true
